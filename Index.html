<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Version Control</title>
    <style>
        :root {
            --bg: #1e1e1e; --panel: #252526; --text: #d4d4d4;
            --accent: #5c87a8; --accent-light: #9cdcfe;
            --success: #4ec9b0; --mod: #569cd6; --del: #ce9178;
            --warn: #eebb00; --danger: #f14c4c; --border: #3e3e42;
            --modal-bg: rgba(0,0,0,0.85);
            --diff-add-bg: #1e3a2f; --diff-add-fg: #4ec9b0;
            --diff-rem-bg: #3e2e2e; --diff-rem-fg: #ce9178;
        }
        body { font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 40px; max-width: 1100px; margin: auto; line-height: 1.6; }
        h2, h3 { font-weight: normal; color: var(--accent-light); margin-bottom: 15px; }
        .panel { background: var(--panel); border: 1px solid var(--border); padding: 25px; margin-bottom: 30px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        input { background: #3c3c3c; border: 1px solid var(--border); color: #f0f0f0; padding: 10px; border-radius: 2px; outline: none; }
        
        button { 
            cursor: pointer; padding: 6px 14px; border: 1px solid var(--border); 
            background: #333; color: #f0f0f0; transition: all 0.2s; 
            font-family: inherit; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px;
        }
        button:hover { background: #444; border-color: var(--accent); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .btn-primary { border-color: var(--accent); color: var(--accent-light); }
        .btn-snapshot { background: var(--accent); color: #fff; border: none; font-weight: bold; }
        .btn-snapshot:hover { background: #6a9bc2; }
        .btn-gc { border-color: var(--warn); color: var(--warn); }
        
        .btn-sm { padding: 2px 8px; margin-left: 5px; font-size: 0.75em; }
        .btn-del { color: var(--del); border-color: var(--del); }
        .btn-del:hover { background: var(--danger); color: white; border-color: var(--danger); }
        
        .ignore-box { border-left: 3px solid var(--border); padding-left: 15px; margin: 20px 0; font-size: 0.9em; color: #888; }
        #changeLog { font-family: "Consolas", monospace; font-size: 0.8em; margin: 15px 0; min-height: 20px; padding: 10px; background: #1e1e1e; max-height: 300px; overflow-y: auto; }
        .file-new { color: var(--success); } .file-mod { color: var(--mod); } .file-del { color: var(--del); } .diff-size { color: #888; font-size: 0.85em; margin-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border); color: var(--accent-light); }
        td { padding: 12px; border-bottom: 1px solid var(--border); color: #ccc; }
        .snapshot-row:hover { background: #2a2a2a; cursor: pointer; }
        .details-row { background: #1a1a1a; display: none; }
        
        .file-list { padding: 10px 20px; display: grid; grid-template-columns: 1fr; gap: 5px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: #252526; padding: 6px 12px; border: 1px solid #333; }
        .file-name { font-family: "Consolas", monospace; color: #d4d4d4; font-size: 0.85em; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: var(--modal-bg); }
        .modal-content { background-color: var(--panel); margin: 5% auto; padding: 20px; border: 1px solid var(--border); width: 80%; max-height: 80vh; display: flex; flex-direction: column; }
        pre { background: #1e1e1e; padding: 15px; overflow: auto; flex-grow: 1; color: #d4d4d4; font-family: monospace; border: 1px solid #333; }
        .status-msg { font-style: italic; font-size: 0.85em; color: #666; margin-top: -10px; margin-bottom: 20px;}
        
        .diff-add { background-color: var(--diff-add-bg); color: var(--diff-add-fg); display: block; width: 100%; }
        .diff-rem { background-color: var(--diff-rem-bg); color: var(--diff-rem-fg); display: block; width: 100%; text-decoration: line-through; opacity: 0.8; }
        .diff-nop { opacity: 0.5; }
    </style>
</head>
<body>
    <h2>Version Control</h2>
    <p class="status-msg" id="statusInfo">Awaiting folder selection...</p>
    
    <div class="panel">
        <div class="controls">
            <button id="btnInit" class="btn-primary">Select Project Folder</button>
            <input type="text" id="userName" placeholder="Your Name" style="width: 140px;">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
            <div class="ignore-box" style="margin: 0; flex-grow: 1;">
                <strong>Ignore Patterns:</strong> 
                <input type="text" id="ignoreInput" placeholder="*.pyc, venv/, .env" style="width: 60%; margin-left: 10px; background: transparent; border: none; border-bottom: 1px solid #555; color: #aaa;">
            </div>
            <button id="btnGC" class="btn-gc">Prune Storage</button>
        </div>
    </div>

    <div class="panel">
        <h3>Working Status</h3>
        <button id="btnRefreshStatus">Scan for Changes</button>
        <div id="changeLog">Awaiting scan...</div>
        <div class="controls" style="margin-top: 25px;">
            <input type="text" id="commitMsg" placeholder="Describe changes... (Ctrl+Enter)" style="flex-grow: 1;">
            <button id="btnSnapshot" disabled class="btn-snapshot">Take Snapshot</button>
        </div>
    </div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>History Timeline</h3>
            <input type="text" id="searchInput" placeholder="Search..." style="width: 250px; padding: 6px;">
        </div>
        <table id="historyTable"><thead><tr><th>Time</th><th>User</th><th>Message</th><th>Action</th></tr></thead><tbody id="historyBody"></tbody></table>
    </div>

    <div id="fileModal" class="modal">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;border-bottom:1px solid #3e3e42;padding-bottom:10px;">
                <h3 id="modalTitle" style="margin:0">Content</h3>
                <span class="close-modal" style="cursor:pointer;font-size:0.85em;text-decoration:underline;text-transform:uppercase;letter-spacing:0.5px;">Close</span>
            </div>
            <pre id="modalCode"></pre>
        </div>
    </div>

    <script>
        let dirHandle;
        let db = { history: [], lastUser: "", ignoreRules: "*.pyc, venv/, .env" };
        
        const el = {
            btnInit: document.getElementById('btnInit'),
            btnSnapshot: document.getElementById('btnSnapshot'), btnRefreshStatus: document.getElementById('btnRefreshStatus'),
            btnGC: document.getElementById('btnGC'), ignoreInput: document.getElementById('ignoreInput'),
            changeLog: document.getElementById('changeLog'), historyBody: document.getElementById('historyBody'),
            commitMsg: document.getElementById('commitMsg'), userName: document.getElementById('userName'),
            searchInput: document.getElementById('searchInput'), modal: document.getElementById('fileModal'),
            modalTitle: document.getElementById('modalTitle'), modalCode: document.getElementById('modalCode'),
            statusInfo: document.getElementById('statusInfo'),
            closeModal: document.querySelector('.close-modal')
        };

        const DB_NAME = 'VC_SubfolderDB', STORE_NAME = 'settings';
        function openDB() { return new Promise((res, rej) => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME); }; req.onsuccess = e => res(e.target.result); req.onerror = e => rej(e.target.error); }); }
        async function saveHandle(h) { const d = await openDB(); const tx = d.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).put(h, 'projectHandle'); }
        async function getSavedHandle() { const d = await openDB(); return new Promise(res => { const tx = d.transaction(STORE_NAME, 'readonly'); const r = tx.objectStore(STORE_NAME).get('projectHandle'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
        async function verifyPerm(h) { if ((await h.queryPermission({mode:'readwrite'}))==='granted') return true; return (await h.requestPermission({mode:'readwrite'}))==='granted'; }

        window.onload = async () => { 
            const saved = await getSavedHandle(); 
            if (saved) { 
                el.btnInit.textContent = `Reopen: ${saved.name}`;
                el.btnInit.onclick = async () => { 
                    if (await verifyPerm(saved)) { 
                        dirHandle = saved; 
                        await initApp(); 
                        setupFreshInit();
                        el.btnInit.textContent = "Change Project Folder";
                    } 
                }; 
            } else {
                setupFreshInit(); 
            }
        };

        function setupFreshInit() { 
            el.btnInit.onclick = async () => { 
                try { 
                    dirHandle = await window.showDirectoryPicker({mode:'readwrite'}); 
                    await saveHandle(dirHandle); 
                    await initApp(); 
                    el.btnInit.textContent = "Change Project Folder";
                } catch(e) {} 
            }; 
        }

        async function initApp() { 
            el.statusInfo.innerText = "Loading project data...";
            await loadMeta(); 
            if (db.lastUser) el.userName.value = db.lastUser; 
            if (db.ignoreRules) el.ignoreInput.value = db.ignoreRules; 
            refreshUI(); 
            el.statusInfo.innerText = `Connected to: ${dirHandle.name}`;
            await scanStatus(); 
        }
        
        function shouldIgnore(entryName, fullPath, isDir) { 
            const rules = el.ignoreInput.value.split(',').map(r => r.trim()).filter(r => r !== "");
            rules.push(".version_repo", "v-system-subfolders.html");
            return rules.some(rule => {
                if (rule.startsWith('*.')) return !isDir && entryName.endsWith(rule.slice(1));
                if (rule.endsWith('/')) return isDir && entryName === rule.slice(0, -1);
                return entryName === rule || fullPath === rule;
            });
        }

        async function scanRecursive(handle, path = "") {
            let files = [];
            for await (const entry of handle.values()) {
                const fullPath = path ? `${path}/${entry.name}` : entry.name;
                const isDir = entry.kind === 'directory';
                if (shouldIgnore(entry.name, fullPath, isDir)) continue;
                if (isDir) {
                    files = files.concat(await scanRecursive(entry, fullPath));
                } else {
                    const f = await entry.getFile();
                    files.push({ name: fullPath, hash: await getHash(f), size: f.size });
                }
            }
            return files;
        }

        async function scanStatus() {
            if (!dirHandle) return;
            el.changeLog.innerText = "Scanning project...";
            const curFilesList = await scanRecursive(dirHandle);
            const curFiles = new Map(curFilesList.map(f => [f.name, f]));
            
            const lastSnap = db.history.length > 0 ? db.history[0] : null;
            const lastFiles = lastSnap ? new Map(lastSnap.files.map(f => [f.name, f])) : new Map();
            let hasChanges = false; let html = "";

            curFiles.forEach((info, n) => {
                const last = lastFiles.get(n);
                if (!last) { html += `<div class="file-new">[NEW] ${n}</div>`; hasChanges = true; } 
                else if (last.hash !== info.hash) { 
                    html += `<div class="file-mod">[MOD] ${n} <button class="btn-sm" onclick="viewDiff('${n}', '${last.hash}')">Diff</button></div>`; 
                    hasChanges = true; 
                }
            });
            lastFiles.forEach((info, n) => { if (!curFiles.has(n)) { html += `<div class="file-del">[DEL] ${n}</div>`; hasChanges = true; } });
            el.changeLog.innerHTML = html || "No changes detected."; el.btnSnapshot.disabled = !hasChanges;
        }

        el.btnRefreshStatus.onclick = scanStatus;
		
        el.btnSnapshot.onclick = async () => {
			if (!el.commitMsg.value || !el.userName.value) return alert("Name and message required.");
			const diskId = await getDiskId();
			if (db.history.length > 0 && db.history[0].id !== diskId) return alert("Collision! Someone else saved. Scan first.");
			
			el.statusInfo.innerText = "Saving snapshot...";
			
			const dateOptions = { 
				year: 'numeric', 
				month: '2-digit', 
				day: '2-digit', 
				hour: '2-digit', 
				minute: '2-digit', 
				second: '2-digit', 
				hour12: false 
			};
			const timeString = new Date().toLocaleString('en-US', dateOptions);

			const snap = { 
				id: crypto.randomUUID().substring(0,8), 
				timestamp: timeString, 
				message: el.commitMsg.value, 
				author: el.userName.value, 
				files: await scanRecursive(dirHandle) 
			};
			
			for (const f of snap.files) {
				const pathParts = f.name.split('/');
				let currentHandle = dirHandle;
				for (let i = 0; i < pathParts.length - 1; i++) {
					currentHandle = await currentHandle.getDirectoryHandle(pathParts[i], {create:true});
				}
				await storeFile(await (await currentHandle.getFileHandle(pathParts[pathParts.length-1])).getFile(), f.hash);
			}
			db.history.unshift(snap); 
			await saveMeta(); 
			refreshUI(); 
			await scanStatus();
			el.statusInfo.innerText = `Connected to: ${dirHandle.name}`;
		};

        async function restoreFiles(snap) {
			let failedFiles = [];
			
			for (const f of snap.files) {
				try {
					const r = await dirHandle.getDirectoryHandle('.version_repo');
					const objectsDir = await r.getDirectoryHandle('objects');
					const fileEntry = await objectsDir.getFileHandle(f.hash);
					const src = await fileEntry.getFile();
					
					const pathParts = f.name.split('/');
					let currentHandle = dirHandle;
					
					for (let i = 0; i < pathParts.length - 1; i++) {
						currentHandle = await currentHandle.getDirectoryHandle(pathParts[i], {create:true});
					}
					
					const dst = await (await currentHandle.getFileHandle(pathParts[pathParts.length-1], {create:true})).createWritable();
					await dst.write(src);
					await dst.close();
				} catch (e) {
					console.error("Could not restore " + f.name, e);
					failedFiles.push(f.name);
				}
			}
			
			if (failedFiles.length > 0) {
				alert("Følgende filer kunne ikke gendannes. De er muligvis låst af et andet program:\n\n" + failedFiles.join("\n"));
			}
		}

        async function loadMeta() { try { const r = await dirHandle.getDirectoryHandle('.version_repo', {create:true}); const t = await (await (await r.getFileHandle('metadata.json', {create:true})).getFile()).text(); db = JSON.parse(t); } catch(e) { db.history = []; } }
        async function saveMeta() { db.lastUser = el.userName.value; db.ignoreRules = el.ignoreInput.value; const r = await dirHandle.getDirectoryHandle('.version_repo', {create:true}); const w = await (await r.getFileHandle('metadata.json', {create:true})).createWritable(); await w.write(JSON.stringify(db, null, 2)); await w.close(); }
        async function getDiskId() { try { const r = await dirHandle.getDirectoryHandle('.version_repo'); const t = await (await (await r.getFileHandle('metadata.json')).getFile()).text(); return JSON.parse(t).history[0].id; } catch(e) { return null; } }
        async function getHash(f) { const b = await f.arrayBuffer(); const h = await crypto.subtle.digest('SHA-256', b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('').substring(0,12); }
        async function storeFile(f, h) { const r = await dirHandle.getDirectoryHandle('.version_repo', {create:true}); const o = await r.getDirectoryHandle('objects', {create:true}); try { await o.getFileHandle(h); } catch { const w = await (await o.getFileHandle(h, {create:true})).createWritable(); await w.write(f); await w.close(); } }

        function refreshUI() {
            const term = el.searchInput.value.toLowerCase();
            el.historyBody.innerHTML = db.history.filter(s => (s.message+s.author).toLowerCase().includes(term)).map(s => `
                <tr class="snapshot-row" onclick="toggleDetails('${s.id}')">
                    <td>${s.timestamp}</td><td>${s.author}</td><td><strong>${s.message}</strong></td>
                    <td>
                        <button class="btn-sm" onclick="event.stopPropagation(); restoreFull('${s.id}')">Restore All</button>
                        <button class="btn-sm btn-del" onclick="event.stopPropagation(); deleteSnapshot('${s.id}')">Delete</button>
                    </td>
                </tr>
                <tr id="details-${s.id}" class="details-row"><td colspan="4"><div class="file-list">${s.files.map(f => `<div class="file-item"><span class="file-name">${f.name}</span><div><button class="btn-sm" onclick="viewFile('${f.hash}','${f.name}')">View</button><button class="btn-sm" onclick="restoreSingle('${f.hash}','${f.name}')">Restore</button></div></div>`).join('')}</div></td></tr>`).join('');
        }

        window.toggleDetails = id => { const r = document.getElementById(`details-${id}`); r.style.display = r.style.display === 'table-row' ? 'none' : 'table-row'; };
        
        window.deleteSnapshot = async id => {
            if (confirm("Delete snapshot from history?")) {
                db.history = db.history.filter(x => x.id !== id);
                await saveMeta();
                refreshUI();
            }
        };

		window.restoreFull = async id => { 
			const snap = db.history.find(x => x.id === id);
			if (snap && confirm("Restore all files from this version? Current files will be overwritten.")) { 
				el.statusInfo.innerText = "Restoring all files...";
				await restoreFiles(snap); 
				el.statusInfo.innerText = "Restore complete.";
				await scanStatus(); 
                setTimeout(() => el.statusInfo.innerText = `Connected to: ${dirHandle.name}`, 3000);
			} 
		};
        
        window.restoreSingle = async (h, n) => {
			if (confirm(`Restore file "${n}" to this version?`)) {
				try {
					el.statusInfo.innerText = `Restoring ${n}...`;
					const r = await dirHandle.getDirectoryHandle('.version_repo');
					const src = await (await (await r.getDirectoryHandle('objects')).getFileHandle(h)).getFile();
					const pathParts = n.split('/');
					let cur = dirHandle;
					for(let i=0; i<pathParts.length-1; i++) cur = await cur.getDirectoryHandle(pathParts[i], {create:true});
					const dst = await (await cur.getFileHandle(pathParts[pathParts.length-1], {create:true})).createWritable();
					await dst.write(src); await dst.close();
					await scanStatus();
					el.statusInfo.innerText = "File restored.";
					setTimeout(() => el.statusInfo.innerText = `Connected to: ${dirHandle.name}`, 3000);
				} catch (e) {
					alert(`Kunne ikke overskrive filen "${n}". Luk filen i andre programmer og prøv igen.`);
					el.statusInfo.innerText = "Restore failed.";
				}
			}
		};

        window.viewFile = async (h, n) => { 
            el.modal.style.display="block"; 
            el.modalTitle.innerText = `Viewing: ${n}`;
            const r=await dirHandle.getDirectoryHandle('.version_repo'); 
            const f=await(await(await r.getDirectoryHandle('objects')).getFileHandle(h)).getFile(); 
            el.modalCode.textContent=await f.text(); 
        };
        
        window.viewDiff = async (n, h) => { 
            el.modal.style.display="block"; el.modalTitle.innerText=`Diff: ${n}`;
            const r=await dirHandle.getDirectoryHandle('.version_repo'); const oldT=await(await(await(await r.getDirectoryHandle('objects')).getFileHandle(h)).getFile()).text();
            const pathParts=n.split('/'); let cur=dirHandle; for(let i=0;i<pathParts.length-1;i++) cur=await cur.getDirectoryHandle(pathParts[i]);
            const newT=await(await(await cur.getFileHandle(pathParts[pathParts.length-1])).getFile()).text();
            el.modalCode.innerHTML = simpleDiff(oldT, newT);
        };

        function simpleDiff(text1, text2) {
            const lines1 = text1.split('\n'), lines2 = text2.split('\n');
            let i = 0, j = 0, html = "";
            while (i < lines1.length || j < lines2.length) {
                if (lines1[i] === lines2[j]) { html += `<div class="diff-nop">  ${escapeHtml(lines1[i] || "")}</div>`; i++; j++; }
                else {
                    let foundMatch = false;
                    for (let k = 1; k < 5; k++) {
                        if (j + k < lines2.length && lines1[i] === lines2[j + k]) {
                            for (let m = 0; m < k; m++) html += `<div class="diff-add">+ ${escapeHtml(lines2[j + m])}</div>`;
                            j += k; foundMatch = true; break;
                        }
                        if (i + k < lines1.length && lines2[j] === lines1[i + k]) {
                             for (let m = 0; m < k; m++) html += `<div class="diff-rem">- ${escapeHtml(lines1[i + m])}</div>`;
                            i += k; foundMatch = true; break;
                        }
                    }
                    if (!foundMatch) {
                        if (i < lines1.length) { html += `<div class="diff-rem">- ${escapeHtml(lines1[i])}</div>`; i++; }
                        if (j < lines2.length) { html += `<div class="diff-add">+ ${escapeHtml(lines2[j])}</div>`; j++; }
                    }
                }
            }
            return html;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        el.closeModal.onclick = () => el.modal.style.display="none";
        
        el.btnGC.onclick = async () => {
            if (!dirHandle || !confirm("Permanently delete unused file versions to save space?")) return;
            el.statusInfo.innerText = "Cleaning storage...";
            const used = new Set(); db.history.forEach(s => s.files.forEach(f => used.add(f.hash)));
            const r = await dirHandle.getDirectoryHandle('.version_repo'); const o = await r.getDirectoryHandle('objects');
            let c = 0; for await (const e of o.values()) if (!used.has(e.name)) { await o.removeEntry(e.name); c++; }
            alert(`Storage pruned. Deleted ${c} unused versions.`);
            el.statusInfo.innerText = `Connected to: ${dirHandle.name}`;
        };
    </script>
</body>
</html>
